[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "benchmarks/fixture-generator",
    "crates/application",
    "crates/diagnostics",
    "crates/domain",
    "crates/import",
    "crates/persistence",
    "crates/scoring",
    "crates/scheduling",
    "crates/sectioning",
    "crates/solver-client",
    "crates/solver-contract",
    "crates/test-oracle",
    "crates/validation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Bell contributors"]

[workspace.dependencies]
anyhow = "=1.0.102"
blake3 = "=1.8.2"
bytes = "=1.10.1"
calamine = "=0.36.1"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "=4.5.48", features = ["derive"] }
csv = "=1.3.1"
prost = "=0.14.1"
prost-build = "=0.14.1"
proptest = "=1.9.0"
quick-xml = { version = "=0.41.0", default-features = false }
rusqlite = { version = "=0.37.0", features = ["bundled", "chrono", "uuid"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tempfile = "=3.23.0"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
thiserror = "=2.0.17"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
